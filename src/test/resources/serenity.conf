webdriver {
  driver = chrome
  autodownload = true

  capabilities {
    browserName = "chrome"
    "goog:chromeOptions" {
      args = ["window-size=1366,900", "disable-infobars", "disable-notifications",
              "disable-save-password-bubble", "disable-features=PasswordLeakDetection,PasswordCheck,SafetyCheck"]
      # Sin esto Chrome muestra el aviso de "contraseña filtrada" de Google, que bloquea los clics de la prueba
      prefs {
        credentials_enable_service = false
        "profile.password_manager_enabled" = false
        "profile.password_manager_leak_detection" = false
      }
    }
  }
}

serenity {
  project.name = "SauceDemo - Prueba E2E de flujo de compra"
  take.screenshots = FOR_EACH_ACTION
}

headless.mode = false

# Credenciales públicas de demo de SauceDemo.
# Se sobreescriben con las variables de entorno SAUCEDEMO_USERNAME / SAUCEDEMO_PASSWORD (ver TestConfig).
users {
  standard {
    username = "standard_user"
    password = "secret_sauce"
  }
}

environments {
  default {
    webdriver.base.url = "https://www.saucedemo.com/"
  }
  headless {
    webdriver.base.url = "https://www.saucedemo.com/"
    headless.mode = true
  }
}
